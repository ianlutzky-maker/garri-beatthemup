<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#090b17;color:#f2ead6;font:14px ui-monospace,monospace}main{width:min(1100px,96vw);padding:16px 0}.strip,footer{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#b8aabc;letter-spacing:.13em;font-size:11px}.strip{padding:0 0 11px}.dot{display:inline-block;width:8px;height:8px;margin-right:8px;background:#fe665f;box-shadow:0 0 12px #fe665f}section{position:relative;border:1px solid #564359;box-shadow:0 16px 70px #000a;overflow:hidden}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}section:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,#05031524 3px 4px);pointer-events:none}footer{padding:13px 0;flex-wrap:wrap}button{font:inherit;letter-spacing:inherit;cursor:pointer;color:#f5ddaa;background:#171322;border:1px solid #755467;padding:8px 13px}button:focus-visible,button:hover{outline:2px solid #ffbd79;outline-offset:2px}#menu{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;background:linear-gradient(90deg,#0b0a19f2,#110e20ba 60%,#130f2480);z-index:1;padding:3%;overflow:auto}#menu[hidden]{display:none}h1{font:bold clamp(23px,7vw,91px)/.84 Impact,'Arial Black',sans-serif;margin:0;color:#ffbd79;letter-spacing:.025em;text-shadow:3px 4px #a53954,6px 8px #0c0915}h2{font-size:clamp(9px,1.65vw,20px);letter-spacing:.24em;text-transform:uppercase;margin:0 0 13px;color:#8ef4db}#copy{max-width:590px;font-size:clamp(8px,1.22vw,14px);line-height:1.6;margin:clamp(10px,2.5vw,30px) 0 12px;color:#fff2dc}#start{background:#ffbd79;color:#221327;font-weight:bold;letter-spacing:.12em;padding:clamp(5px,1.1vw,13px) clamp(12px,3vw,33px)}#retry{margin-top:8px}kbd{color:#8ef4db}#face{position:absolute;right:1%;bottom:4%;width:28%;opacity:.88;pointer-events:none}@media(max-width:650px){#face{opacity:.78;width:25%;right:2%;bottom:3%}}
</style>
<main>

<script>
'use strict';
const byId=id=>document.getElementById(id);
const canvas=byId('screen'), ctx=canvas.getContext('2d');
const W=640,H=360, TOP=195,BOTTOM=323;
const clamp=(n,a,b)=>Math.max(a,Math.min(n,b));
const sign=n=>n<0?-1:1;
const rand=(a,b)=>a+Math.random()*(b-a);
const keys=new Set(), taps=new Set();
const levels=[
  {name:'Último bondi', area:'AVENIDA / 02:57', color:'#ffbd79', waves:['p','ppp','pppp','spp','pspp','pppsp','pspps','spspp'], tips:['Alineá tu sombra con la del patotero. J · J · J','Esquivá hacia el fondo o el frente cuando veas el aviso.','Alterná técnicas para cargar Despeje.','K rompe el escudo. También podés pegarle por atrás.','L agarra de cerca y lanza en la dirección que mirás.','Sacá a los patoteros del medio con un lanzamiento.','Movete entre el cordón y la calle.','Rompé el escudo antes de que te rodeen.']},
  {name:'Feria de madrugada', area:'FERIA / 03:12', color:'#8ef4db', waves:['tppt','cctpp','ttcpp','spcct','ccttpp','tspct','pccts','stccpt'], tips:['Cuando levante la botella, salí de su trayectoria.','Los custodios se cubren en pareja. Separalos con un lanzamiento.','Tirá a un rival contra los cajones para romperlos.','Usá el fondo de la calle para esquivar las botellas.','I activa Despeje cuando se llena la barra.','K deja expuesto al escudo.','Salí del pasillo antes de que te cierren el paso.','Abrite paso hasta el corralón.']},
  {name:'El corralón', area:'CORRALÓN / 03:26', color:'#ff817d', waves:['cct','sccpt','ccts','b'],tips:['Los custodios te esperan bajo los reflectores.','Los reflectores marcan la entrada.','Última guardia antes del portón.','Leé el palo. Pegá cuando quede expuesto.']}
];
const enemyStats={
  p:{hp:56,speed:65,reach:32,wind:.46,damage:9,name:'Patotero'},
  s:{hp:94,speed:40,reach:39,wind:.7,damage:15,name:'Grandote'},
  t:{hp:48,speed:59,reach:215,wind:.82,damage:11,name:'Botellero'},
  c:{hp:74,speed:78,reach:42,wind:.5,damage:12,name:'Custodio'},
  b:{hp:420,speed:74,reach:139,wind:.8,damage:20,name:'El Loco del Palo'}
};
const areaLines=[
  ['Vamos allá.', 'Acá viene el garrote.', 'Se terminó el recreo, muchachos.', 'Corré el tacho que paso.', '¿Me van a hacer perder el bondi?', 'Ya van a ver con este garrote.', 'Dale, que enfría el café.'],
  ['Permiso, que estoy laburando.', 'Ojo con los cajones.', '¿Quién pidió fruta para llevar?', 'Vamos, que la feria ya cerró.', '¿Otra botella? Qué manera de joder.', 'Me están haciendo transpirar la campera.', 'Hay que bajarlos a todos.'],
  ['Qué linda noche para romper un portón.', 'Uno más y cierro turno.', 'Bueno, Loco. Mostrame ese palo.']
];
const boostDuration=12, boostMultiplier=1.15;
let drink, drinkCooldown=0, drinkOffered=false, areaCall=0;
const moves={
  jab:{duration:.22,active:.075,x:42,y:17,damage:10,stun:.24},
  cross:{duration:.24,active:.085,x:46,y:18,damage:13,stun:.3},
  fin:{duration:.37,active:.12,x:54,y:21,damage:22,stun:.54},
  heavy:{duration:.49,active:.19,x:51,y:23,damage:28,stun:.69},
  grab:{duration:.51,active:.12,x:34,y:18,damage:29,stun:.8},
  clear:{duration:.59,active:.16,x:94,y:49,damage:34,stun:.87}
};
let mode='title', stage=0, wave=0, score=0, checkpoint=0, elapsed=0, retries=0;
let player, enemies=[], bottles=[], particles=[], crates=[], neighbors=[], clock=0;
let camera=0, gate=0, exitOpen=false, intro=0, hitstop=0, shake=0, victory=0, flash=0;
let levelText=0, talk=0, serial=0;
function resetStage(index){
  stage=index;wave=0;gate=0;camera=0;exitOpen=false;intro=index===0?2.7:1.9;
  levelText=3.4;talk=index===0?8:0;hitstop=shake=victory=flash=0;
  enemies=[];bottles=[];particles=[];crates=[];serial=0;
  drink=null;drinkCooldown=0;drinkOffered=false;areaCall=0;
  neighbors=[{x:144,y:199},{x:276,y:213},{x:424,y:193}];
  player={x:97,y:259,dir:1,hp:100,energy:0,inv:0,stun:0,dodge:0,step:0,
    dx:0,dy:0,combo:0,chain:0,move:null,last:'',buffer:null,boost:0,sip:0};
  mode='play';keys.clear();taps.clear();showMenu();
}
function newGame(){
  score=checkpoint=elapsed=retries=0;
  resetStage(0);
}
function retryStage(){
  retries++;score=checkpoint;resetStage(stage);
}
function spawn(){
  const pattern=levels[stage].waves[wave];
  drink=null;drinkOffered=false;areaCall=wave?3:0;
  neighbors.forEach((n,i)=>{n.exit=i%2?1:-1;});
  enemies=[...pattern].map((type,i)=>{
    const right=i===0||i%3!==2;
    const offset=type==='b'?360:clamp(340+i*43,350,572);
    const boss=type==='b';
    const hp=enemyStats[type].hp;
    const name=type==='p'?['Patotero','Villero','Pandillero'][(serial+stage)%3]:enemyStats[type].name;
    return {id:serial++,type,name,x:gate+(right?offset:45),y:boss?249:205+(i*31)%115,dir:right?-1:1,
      hp,max:hp,stun:0,guard:0,wait:boss?2.35:.55+i*.21,attack:null,step:0,air:0,vx:0,
      hit:0,dead:0,pattern:0,phase:1,opening:false,thrown:false,trail:new Set()};
  });
  crates=stage===1?[{x:gate+291,y:224},{x:gate+476,y:287}]:[];
  levelText=2.8;
  sfx('wave');
}
function overlay(label,title,copy,button,retry=false){
  byId('eyebrow').textContent=label;
  byId('title').innerHTML=title;
  byId('copy').innerHTML=copy;
  byId('start').textContent=button;
  byId('retry').hidden=!retry;
  byId('menu').hidden=false;
}
function timeLabel(seconds){
  return `${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;
}
function showMenu(){
  byId('menu').hidden=mode==='play';
  byId('face').hidden=mode!=='title';
  if(mode==='title') overlay('Joaquín Garrigós en','TURNO<br>NOCHE',
    'Buenos Aires, 02:57. El último aviso de la radio.<br><kbd>WASD / FLECHAS</kbd> Mover · <kbd>J</kbd> Combo · <kbd>K</kbd> Fuerte · <kbd>L</kbd> Agarre<br><kbd>ESPACIO</kbd> Esquive · <kbd>I</kbd> Despeje · <kbd>ESC</kbd> Pausa','EMPEZAR TURNO');
  if(mode==='pause') overlay(levels[stage].name,'EN PAUSA','Esc para volver al turno.','CONTINUAR',true);
  if(mode==='dead') overlay(levels[stage].name,'FIN DEL<br>INTENTO',`Puntaje ${score.toLocaleString('es-AR')} · Tiempo ${timeLabel(elapsed)}`,'REINTENTAR NIVEL');
  if(mode==='won') overlay('03:44 / Buenos Aires','TURNO<br>CERRADO',`«Ahora sí, cierro turno».<br><kbd>${score.toLocaleString('es-AR')} PUNTOS</kbd> · ${timeLabel(elapsed)} · ${retries} reintentos`,'JUGAR DE NUEVO');
}
function primary(){
  initAudio();
  if(mode==='pause'){mode='play';showMenu();}
  else if(mode==='dead') retryStage();
  else if(mode==='title'||mode==='won') newGame();
}
function togglePause(){
  if(mode==='play'||mode==='pause'){
    mode=mode==='play'?'pause':'play';keys.clear();taps.clear();showMenu();
  }
}
const controls=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','KeyJ','KeyK','KeyL','KeyI','Space','Escape','KeyP'];
addEventListener('keydown',e=>{
  if(controls.includes(e.code)) e.preventDefault();
  if(e.repeat)return;
  if(e.code==='Escape'||e.code==='KeyP'){togglePause();return;}
  if((e.code==='Enter'||e.code==='Space')&&mode!=='play'){
    if(e.code==='Space'||document.activeElement.tagName!=='BUTTON'){e.preventDefault();primary();}
    return;
  }
  if(mode==='play'){keys.add(e.code);taps.add(e.code);}
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{if(mode==='play')togglePause();});
byId('start').onclick=primary;
byId('retry').onclick=retryStage;
byId('pause').onclick=togglePause;
function axis(positive,negative){return Number(positive.some(k=>keys.has(k)))-Number(negative.some(k=>keys.has(k)));}
function gain(kind,amount){
  if(kind!==player.last)player.energy=Math.min(100,player.energy+amount);
  player.last=kind;
}
function beginMove(kind){
  if(kind==='clear'&&player.energy<100)return;
  if(kind==='quick'){
    player.combo=player.chain>0?player.combo%3+1:1;
    kind=['jab','cross','fin'][player.combo-1];
    player.chain=.64;
  }else player.chain=0;
  if(kind==='clear'){player.energy=0;player.last='';player.inv=.52;}
  player.move={kind,t:0,done:false};
  sfx(kind==='clear'?'clear':kind==='heavy'?'heavyWind':'swing');
}
function playerUpdate(dt){
  const p=player;
  p.inv-=dt;p.stun-=dt;p.chain-=dt;p.sip-=dt;
  const boost=p.boost>0?boostMultiplier:1;
  let x=axis(['ArrowRight','KeyD'],['ArrowLeft','KeyA']);
  let y=axis(['ArrowDown','KeyS'],['ArrowUp','KeyW']);
  const length=Math.hypot(x,y)||1;x/=length;y/=length;
  if(p.stun<=0&&victory<=0){
    if(taps.has('Space')&&p.dodge<=0&&p.inv<=.10){
      p.dx=x||y?x:p.dir;p.dy=y;p.dodge=.25;p.inv=.36;p.move=null;p.buffer=null;
      sfx('dash');
    }
    if(p.dodge>0){
      p.dodge-=dt;p.x+=p.dx*288*dt*boost;p.y+=p.dy*226*dt*boost;
      if(p.dx)p.dir=sign(p.dx);
    }else{
      if(x&&(!p.move||p.move.done))p.dir=sign(x);
      const key=[['KeyI','clear'],['KeyL','grab'],['KeyK','heavy'],['KeyJ','quick']].find(([k])=>taps.has(k));
      if(key&&(!p.move||p.move.t>=.04))p.buffer=key[1];
      if(!p.move&&p.buffer){beginMove(p.buffer);p.buffer=null;}
      const speed=(p.move?52:160)*boost;
      p.x+=x*speed*dt;p.y+=y*speed*.67*dt;
      if(x||y)p.step+=dt*12;else p.step=0;
      if(p.move){
        const m=p.move, data=moves[m.kind];m.t+=dt*boost;
        if(!m.done&&m.t>=data.active){m.done=true;strike(m.kind,data);if(m.kind==='heavy'&&!m.connected)sfx('swing');}
        if(m.t>=data.duration)p.move=null;
      }
    }
  }
  p.y=clamp(p.y,TOP,BOTTOM);
  p.x=clamp(p.x,gate+27,gate+(exitOpen?913:610));
}
function impact(x,y,color,count=9){
  for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-105,105),vy:rand(-95,32),life:rand(.16,.36),color});
}
function hitEnemy(e,damage,stun,dir,strong){
  if(e.hp<=0)return;
  e.hp=Math.max(0,Math.round((e.hp-damage)*100)/100);e.hit=.16;
  if(e.type!=='b'){
    e.stun=stun;e.attack=null;e.wait=Math.max(e.wait,.25);e.vx=dir*(strong?110:42);
  }
  if(!e.hp){
    e.dead=.56;e.attack=null;score+=e.type==='b'?3500:e.type==='s'?370:e.type==='c'?300:e.type==='t'?250:180;
    if(e.type==='b'){victory=3.35;bottles=[];player.inv=5;impact(e.x+40,e.y-24,'#ffe2a2',25);sfx('bossdown');}
  }
  impact(e.x,e.y-(e.type==='b'?48:31),strong?'#ffe096':'#fff1df',strong?15:7);
  hitstop=Math.max(hitstop,strong?.066:.033);shake=Math.max(shake,strong?4:2);
}
function strike(kind,data){
  const p=player;
  const boost=p.boost>0?boostMultiplier:1;
  const strong=['fin','heavy','grab','clear'].includes(kind);
  const targets=enemies.filter(e=>{
    const dx=(e.x-p.x)*p.dir;
    const boss=e.type==='b'?13:0;
    return e.hp>0&&Math.abs(e.y-p.y)<=data.y&&
      (kind==='clear'?Math.abs(dx)<=data.x:dx>=-12-boss&&dx<=data.x+boss);
  }).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
  let connected=false;
  for(const e of kind==='grab'?targets.slice(0,1):targets){
    const face=sign(p.x-e.x)===e.dir;
    const partner=enemies.some(o=>o!==e&&o.type==='c'&&o.hp>0&&!o.attack&&o.stun<=0&&Math.abs(o.x-e.x)<62&&Math.abs(o.y-e.y)<31);
    const shield=e.type==='s'&&face&&e.guard<=0;
    const covered=e.type==='c'&&partner&&face&&e.guard<=0&&!e.attack;
    if((shield||covered)&&!['heavy','clear'].includes(kind)){
      impact(e.x+e.dir*13,e.y-29,'#8ad8f3');sfx('guard');shake=2;continue;
    }
    if(kind==='heavy'&&(shield||covered))e.guard=3.2;
    let damage=data.damage*boost;
    if(e.type==='b'){
      if(kind==='grab'){sfx('guard');continue;}
      damage=Math.round(damage*(e.stun>0?1.28:e.attack?.33:.5));
      // Keep the signature attacks in the fight even if a player bursts through a phase.
      const floor=e.phase===1?291:e.phase===2?141:e.opening?0:1;
      if(!e.opening)damage=Math.min(damage,Math.max(0,e.hp-floor));
      if(!damage){sfx('guard');continue;}
    }
    hitEnemy(e,damage,data.stun,kind==='clear'?sign(e.x-p.x):p.dir,strong);
    if(kind==='grab'){
      e.thrown=true;e.throwBoost=boost;e.trail.clear();e.air=.66;e.vx=p.dir*340;e.stun=.83;
    }
    connected=true;
  }
  if(connected){
    if(kind==='heavy'){
      if(p.move)p.move.connected=true;
      hitstop=Math.max(hitstop,.082);shake=Math.max(shake,7);
      impact(p.x+p.dir*41,p.y-39,'#ff9c5e',12);
    }
    sfx(kind==='heavy'?'heavyHit':strong?'slam':'hit');
    if(kind!=='clear')gain(kind==='grab'?'throw':kind==='heavy'?'heavy':'quick',kind==='grab'?26:kind==='heavy'?19:12);
  }
}
function hurt(damage,dx,dy){
  const p=player;
  if(p.inv>0||p.dodge>0||victory>0){
    if(p.dodge>0)gain('dodge',22);
    return;
  }
  p.hp=Math.max(0,p.hp-damage);p.inv=1.07;p.stun=.29;p.move=null;p.buffer=null;
  p.x+=dx*17;p.y+=dy*8;flash=.16;shake=5;hitstop=.06;
  impact(p.x,p.y-29,'#ff7480');sfx('hurt');
  if(!p.hp){mode='dead';keys.clear();showMenu();}
}
function attackCount(){return enemies.filter(e=>e.attack&&e.hp>0).length;}
function enemyUpdate(e,dt){
  const p=player;
  e.hit-=dt;e.stun-=dt;e.guard-=dt;e.wait-=dt;e.air-=dt;
  if(e.vx){
    e.x=clamp(e.x+e.vx*dt,gate+20,gate+620);
    e.vx*=Math.pow(e.air>0?.46:.017,dt);
    if(Math.abs(e.vx)<2)e.vx=0;
  }
  if(e.thrown&&e.air>0){
    for(const other of enemies){
      if(other===e||!other.hp||e.trail.has(other.id)||Math.abs(e.x-other.x)>27||Math.abs(e.y-other.y)>21)continue;
      e.trail.add(other.id);hitEnemy(other,20*e.throwBoost,.7,sign(e.vx),true);sfx('slam');
    }
    for(const c of crates){
      if(c.broken||Math.abs(e.x-c.x)>30||Math.abs(e.y-c.y)>25)continue;
      c.broken=true;score+=125;sfx('slam');impact(c.x,c.y-12,'#ffa95e',26);
      enemies.filter(o=>o.hp&&Math.abs(o.x-c.x)<88&&Math.abs(o.y-c.y)<43)
        .forEach(o=>hitEnemy(o,18*e.throwBoost,.74,sign(o.x-c.x),true));
    }
  }
  if(!e.hp){e.dead-=dt;return;}
  if(e.type==='b'){bossUpdate(e,dt);return;}
  if(e.stun>0)return;
  const data=enemyStats[e.type], dx=p.x-e.x, dy=p.y-e.y;
  if(e.attack){
    e.attack.left-=dt;
    if(e.attack.left>0)return;
    if(e.type==='t'){
      const vx=e.attack.x-e.x, vy=e.attack.y-e.y, norm=Math.hypot(vx,vy)||1;
      bottles.push({x:e.x,y:e.y,vx:vx/norm*244,vy:vy/norm*244,t:0,life:Math.min(.94,norm/244+.18)});
      sfx('bottle');
    }else if(Math.abs(dx)<data.reach+9&&Math.abs(dy)<23&&dx*e.dir>=-8)hurt(data.damage,e.dir,sign(dy));
    else if(p.dodge>0&&Math.abs(dx)<85&&Math.abs(dy)<53)gain('dodge',22);
    e.attack=null;e.wait=e.type==='t'?2.05:1.24+e.id%3*.13;
    return;
  }
  e.dir=sign(dx);
  const range=e.type==='t'?data.reach:data.reach-4;
  const lane=e.type==='t'?95:15;
  if(Math.abs(dx)<range&&Math.abs(dy)<lane&&e.wait<=0&&attackCount()<(stage===0?1:2)){
    e.attack={left:data.wind,total:data.wind,x:p.x,y:p.y};sfx('tell');return;
  }
  let targetX=p.x-sign(dx)*(e.type==='t'?135:19);
  let targetY=p.y;
  if(e.type==='p'&&e.id%2&&Math.abs(dx)<108&&Math.abs(dx)>31)targetY+=e.id%4===1?-27:27;
  if(e.type==='c'&&e.wait>0)targetY+=e.id%2?-19:19;
  let mx=targetX-e.x,my=(targetY-e.y)*1.48;
  for(const other of enemies){
    if(other===e||!other.hp)continue;
    const ox=e.x-other.x,oy=e.y-other.y;
    if(Math.abs(ox)<23&&Math.abs(oy)<13){mx+=sign(ox||e.id-other.id)*16;my+=sign(oy||e.id-other.id)*14;}
  }
  const norm=Math.max(12,Math.hypot(mx,my));
  e.x=clamp(e.x+mx/norm*data.speed*dt,gate+20,gate+620);
  e.y=clamp(e.y+my/norm*data.speed*.73*dt,TOP,BOTTOM);
  e.step+=dt*(Math.abs(mx)+Math.abs(my)>10?11:2);
}
const patterns=[['sweep'],['feint','chop','sweep','chop'],['double','rush','chop','sweep']];
function bossUpdate(e,dt){
  const p=player;
  if(e.stun>0)return;
  if(!e.attack){

let audio, mixer, muted=false, nextBeat=0, beat=0;
function initAudio(){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  if(!audio){
    audio=new Audio();mixer=audio.createGain();mixer.gain.value=muted?0:.35;mixer.connect(audio.destination);

}
byId('mute').onclick=()=>{
  muted=!muted;

  byId('mute').textContent=muted?'SIN SONIDO':'SONIDO';
  if(audio)mixer.gain.setTargetAtTime(muted?0:.35,audio.currentTime,.025);
};
function tone(f,to,t,len,vol,type='triangle'){
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(15,to),t+len);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(g);g.connect(mixer);o.start(t);o.stop(t+len+.01);
}
function noise(t,len,vol,hz){
  const source=audio.createBufferSource(),g=audio.createGain(),filter=audio.createBiquadFilter();
  const buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*len),audio.sampleRate);
  const samples=buffer.getChannelData(0);
  for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
  source.buffer=buffer;filter.type='bandpass';filter.frequency.value=hz;filter.Q.value=.8;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  source.connect(filter);filter.connect(g);g.connect(mixer);source.start(t);
}
function sfx(kind){
  if(!audio||muted)return;
  const t=audio.currentTime;
  const cues={hit:[112,46,.09,.43],slam:[126,31,.16,.62],hurt:[181,47,.2,.45],
    heavyWind:[142,205,.17,.18],heavyHit:[153,29,.21,.72],drinkDrop:[610,912,.18,.13],drink:[392,784,.29,.24],
    tell:[525,416,.085,.1],guard:[720,370,.1,.25],dash:[240,85,.13,.18],swing:[187,83,.075,.08],
    wood:[244,49,.19,.48],bottle:[652,410,.13,.17],clear:[170,680,.28,.26],
    wave:[315,471,.27,.19],phase:[140,75,.33,.24],bossdown:[96,32,.46,.46],win:[393,786,.49,.23]};
  tone(...cues[kind].slice(0,2),t,...cues[kind].slice(2),(kind==='slam'||kind==='heavyHit')?'triangle':'square');
  if(['hit','slam','hurt','wood','dash','bossdown','heavyHit'].includes(kind))noise(t,kind==='heavyHit'?.15:kind==='slam'?.11:.075,.39,kind==='wood'?790:1450);
}
function audioTick(){
  if(!audio||muted||audio.state!=='running')return;
  const now=audio.currentTime;
  if(nextBeat<now-.1)nextBeat=now+.01;
  const tempo=[101,109,114][stage];
  const bass=[55,55,65.4,49,55,55,73.4,65.4];
  const melody=[0,220,0,261.6,0,196,293.7,0,0,220,0,329.6,0,261.6,196,0];
  while(nextBeat<now+.095){
    const n=beat%16,t=nextBeat;
    if(n%4===0)tone(92,40,t,.11,.21,'sine');
    if(n%4===2)tone(185,115,t,.075,.14,'sine');
    noise(t,.035,n%2?.1:.046,4600);
    if(n%4===3)noise(t,.08,.096,2140);
    if(n%4===0||n%4===3){
      const note=bass[Math.floor(beat/4)%bass.length];
      tone(note,note*.98,t,.16,.15,'triangle');
    }
    if(melody[n]){
      const f=melody[n]*(stage===1?1.122:1);
      tone(f,f*.997,t,.115,.044,stage===2?'sawtooth':'square');
      tone(f*2,f*2,t+.012,.09,.025);
    }
    nextBeat+=60/tempo/4;beat++;
  }
}

function frame(ms){
